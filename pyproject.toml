[project]
name = "arctic-route-data"
version = "0.4.0"
description = "北极航线工作包 A：采集、预处理、权威时间、逐时次发布、manifest 与 AB 缓存"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "h5py>=3.13,<4",
    "h5netcdf>=1.6,<2",
    "numpy>=2.2,<3",
    "requests>=2.32,<3",
    "scipy>=1.15,<2",
    "xarray>=2025.1,<2027",
]

[project.optional-dependencies]
acquisition = [
    "cfgrib>=0.9.15,<0.10",
    "copernicusmarine>=2.2,<3",
]
contracts = [
    "arctic-route-contracts",
]

[tool.uv.sources]
arctic-route-contracts = { path = "../arctic_route_contracts", editable = true }

[project.scripts]
arctic-data = "arctic_route_data.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arctic_route_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [
    ".mamba",
    ".mamba-env",
    ".uv-cache",
    ".uv-python",
    ".venv",
    "data",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["RUF001"]

[tool.coverage.run]
branch = true
source = ["arctic_route_data"]
